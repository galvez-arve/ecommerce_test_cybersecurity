<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users | Ecommerce Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Shared CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>👥 User Directory</h1>
        <div class="nav-links">
            <a href="/" class="btn btn-secondary">🏠 Dashboard</a>
            <a href="/products" class="btn btn-secondary">📦 Products</a>
            <a href="/orders" class="btn btn-secondary">📋 Orders</a>
        </div>
    </div>

    <!-- Search Section -->
    <div class="card">
        <div class="search-wrapper">
            <div class="search-input-group">
                <input type="text" id="searchInput" placeholder="Search by name..." aria-label="Search users">
                <button onclick="loadUsers(0)">🔍 Search</button>
            </div>
            <div class="action-buttons">
                <button class="btn btn-outline" onclick="clearSearch()">✖ Clear</button>
                <button class="btn btn-primary" onclick="loadUsers(currentPage)">⟳ Refresh</button>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Address</th>
                    <th>Contact Number</th>
					<th>Email Address</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Populated by JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="pagination-container">
        <div class="pagination-controls">
            <button class="pagination-btn" onclick="previousPage()" id="prevBtn">← Previous</button>
            <div class="page-numbers" id="pageNumbers"></div>
            <button class="pagination-btn" onclick="nextPage()" id="nextBtn">Next →</button>
        </div>
        <div class="page-info">
            Page <span id="currentPageDisplay">0</span> of <span id="totalPagesDisplay">0</span> 
            (<span id="totalItemsDisplay">0</span> users)
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <a href="/">Back to Dashboard</a>
    </div>
</div>

<script th:inline="javascript">
    let currentPage = 0;
    let totalPages = 0;
    let totalItems = 0;

    function loadUsers(page) {
        const search = document.getElementById('searchInput').value;
        const url = `/api/users?page=${page}&size=50&search=${encodeURIComponent(search)}`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                currentPage = data.currentPage;
                totalPages = data.totalPages;
                totalItems = data.totalItems;
                renderTable(data.users);
                updatePagination();
            })
            .catch(error => console.error('Error loading users:', error));
    }

    function renderTable(users) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        users.forEach(user => {
            const row = tbody.insertRow();
            
            // ID (shortened for display)
            const idCell = row.insertCell(0);
            const shortId = user.id.substring(0, 8) + '…';
            idCell.textContent = shortId;
            idCell.style.fontFamily = 'monospace';
            idCell.style.fontSize = '0.9rem';
            idCell.title = user.id; // full ID on hover
            
            // Full Name
            row.insertCell(1).textContent = user.fullName || (user.name + ' ' + user.lastname);
            
            // Address
            row.insertCell(2).textContent = user.address;
            
            // Contact Number
            row.insertCell(3).textContent = user.contactNumber;
			
			row.insertCell(4).textContent = user.emailAddress;
        });
    }

    function updatePagination() {
        document.getElementById('currentPageDisplay').textContent = currentPage + 1;
        document.getElementById('totalPagesDisplay').textContent = totalPages;
        document.getElementById('totalItemsDisplay').textContent = totalItems;

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        prevBtn.disabled = currentPage === 0;
        nextBtn.disabled = currentPage >= totalPages - 1;

        const pageNumbersDiv = document.getElementById('pageNumbers');
        pageNumbersDiv.innerHTML = '';
        
        const maxVisible = 7;
        let startPage = Math.max(0, currentPage - Math.floor(maxVisible / 2));
        let endPage = Math.min(totalPages - 1, startPage + maxVisible - 1);
        if (endPage - startPage < maxVisible - 1) {
            startPage = Math.max(0, endPage - maxVisible + 1);
        }

        for (let i = startPage; i <= endPage; i++) {
            const span = document.createElement('span');
            span.textContent = i + 1;
            span.classList.add('page-number');
            if (i === currentPage) {
                span.classList.add('active');
            }
            span.onclick = () => loadUsers(i);
            pageNumbersDiv.appendChild(span);
        }
    }

    function previousPage() {
        if (currentPage > 0) {
            loadUsers(currentPage - 1);
        }
    }

    function nextPage() {
        if (currentPage < totalPages - 1) {
            loadUsers(currentPage + 1);
        }
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        loadUsers(0);
    }

    // Initial load
    window.onload = () => loadUsers(0);
</script>
<th:block th:replace="fragments/chat-widget :: chat-widget"></th:block>
</body>
</html>
